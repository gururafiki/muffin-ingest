[project]
name = "muffin-ingest"
version = "0.1.0"
description = "Market-data ingestion for Muffin: a provider library, a task ledger, and Dagster assets."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.13,<4.0"

# WHY AGPL AND NOT GPLv3 LIKE EVERY OTHER MUFFIN REPO: `openbb-core` is AGPL-3.0 and is IMPORTED
# here rather than called over HTTP. That is a deliberate trade recorded in the design — the REST
# hop is where a yfinance throttle becomes an empty 204 that is byte-identical to "this symbol has
# no data", which is the confusion that once negative-cached ~8,300 securities in an afternoon.
dependencies = [
  # Orchestration. Pinned, because an asset/check API change is a silent behaviour change.
  "dagster>=1.11,<1.13",
  "dagster-postgres>=0.27,<0.29",
  # THE WEBSERVER IS A SEPARATE DISTRIBUTION AND `dagster` DOES NOT PULL IT IN. Without it the
  # image builds, the code location loads and `dagster definitions validate` passes — and the
  # webserver service then crash-loops with `exec: "dagster-webserver": executable file not found
  # in $PATH`, which reads as a broken image rather than a missing dependency. One image runs all
  # three services, so it carries all three entrypoints.
  "dagster-webserver>=1.11,<1.13",
  # The database, DIRECTLY. Not PostgREST: this writer needs transactions spanning claim -> write ->
  # complete, `for update skip locked`, COPY, and a role with its own statement timeout. PostgREST
  # is the READ path for muffin-ui and stays that way.
  "psycopg[binary,pool]>=3.2,<4",
  # The hub, in-process. Only the extensions actually used — never `openbb[all]`, which is the 1 GB
  # image.
  #
  # TWO KINDS OF EXTENSION, AND THE FIRST LIST HAD ONLY ONE OF THEM. A PROVIDER supplies data
  # (yfinance, finviz); a ROUTER supplies the namespace you call it through (`obb.equity.*`). With
  # providers alone the hub imports perfectly and every call dies on
  #
  #     AttributeError: 'App' object has no attribute 'equity'
  #
  # — a message that names neither the cause nor the fix. The built package held eleven modules,
  # all `economy*` and `fixedincome*`, which arrived transitively via the FRED and OECD providers;
  # nothing had pulled in the routers this pipeline actually calls. Found by driving a run against
  # production, and guarded now by resolving every route in `ROUTES` inside the built image.
  "openbb-core>=1.4,<2",
  # Providers.
  "openbb-yfinance>=1.4,<2",
  "openbb-finviz>=1.3,<2",
  "openbb-nasdaq>=1.4,<2",
  "openbb-fred>=1.4,<2",
  "openbb-oecd>=1.4,<2",
  "openbb-federal-reserve>=1.4,<2",
  # Routers, one per namespace named in `providers/openbb.py::ROUTES`. A route whose router is not
  # installed is a control table advertising work nothing can do.
  "openbb-equity>=1.4,<2",
  "openbb-etf>=1.4,<2",
  "openbb-economy>=1.4,<2",
  "openbb-fixedincome>=1.4,<2",
  "openbb-index>=1.4,<2",
  "openbb-crypto>=1.4,<2",
  "openbb-derivatives>=1.4,<2",
  # The direct providers, for the four things openbb measurably cannot do: N-PORT holdings (no
  # `sec` provider on `etf/holdings`), ISIN resolution (`equity/search` returns zero hits for an
  # ISIN), quarterly SEC statements (`period=quarter` is 422), and DART (TLS 1.2 static-RSA).
  "httpx>=0.28,<0.29",
  "edgartools>=4.14,<5",
  "pdfplumber>=0.11,<0.12",
  "lxml>=5.3,<6",
  # Rate limiting that survives more than one process. Dagster pools serialise RUNS per provider;
  # this enforces requests per second AND per day, which pools cannot express.
  "pyrate-limiter[psycopg]>=3.7,<5",
  # Parquet for the raw layer. pyarrow ALONE, not polars: both acquisition lanes are chunked by
  # construction (a day of the cross-section, or a batch of ten securities' history), so the largest
  # frame either holds is ~73k rows — four orders of magnitude below the 88 M that justified a lazy
  # scan. `UPathIOManager` and `upath` come with dagster, so the whole raw path costs one wheel.
  "pyarrow>=18,<26",
  "pydantic>=2.10,<3",
  "prometheus-client>=0.21,<1",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
# BOTH HALVES, because a bare `mypy` locally should check everything. CI splits it deliberately:
# `checks` runs `mypy --strict src/muffin_ingest tests/unit` with NO dagster installed, which is
# what proves the library imports no orchestrator, and `definitions` covers the other half where
# dagster is present. Running the two together here needs everything installed, which is the normal
# development case.
files = ["src", "tests"]

# THE HUB IS DELIBERATELY NOT A CHECK-TIME DEPENDENCY. `providers/openbb.py` imports it inside a
# function so that `dagster definitions validate`, the unit tests and the CI `checks` job all run
# without ~250 MB of AGPL provider code installed — and the tests drive a fake hub for the same
# reason. mypy still tries to resolve the import, so without this it fails in CI while passing on
# any machine that happens to have openbb installed. Which is precisely what it did: green here,
# `Cannot find implementation or library stub for module named "openbb"` there.
[[tool.mypy.overrides]]
module = ["openbb", "openbb.*"]
ignore_missing_imports = true

# pyarrow ships no py.typed marker. Narrow rather than blanket, for the same reason as above: a
# DIFFERENT import error in this file still fails the build.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: drives a real provider; excluded from CI"]
addopts = "-m 'not live'"
