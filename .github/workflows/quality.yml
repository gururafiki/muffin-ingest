# Required check. Mirrors muffin-deployment's `quality.yml` in spirit: it does not ask whether the
# code is tidy, it asks whether the rules that keep this pipeline honest still hold.
name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  # NEVER cancel on main. Two merges seconds apart used to kill the first one's verification run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The dev extra only — the runtime pulls openbb and dagster, which are minutes of resolution
      # and irrelevant to the pure-logic suite. The image build is where the full set is proven.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # NO psycopg AND NO DAGSTER, and both absences are the point. The ledger takes a
          # PROTOCOL (`DbConn`) rather than a driver, and the library imports no orchestrator, so
          # this job passing is what proves both rather than a comment asserting them.
          #
          # httpx and prometheus-client ARE imported — one provider call is one place that is
          # counted, paced and bounded — so they are installed rather than stubbed.
          pip install ruff mypy pytest pytest-cov pydantic httpx prometheus-client

      - name: Lint
        run: ruff check src tests && ruff format --check src tests

      - name: Types
        # Strict. The classifier decides whether thousands of securities get negative-cached, and a
        # `str | None` slipping through is exactly how that goes wrong quietly.
        #
        # THE LIBRARY ONLY. `muffin_ingest` imports no Dagster by design, and checking it without
        # one installed is what proves that rather than asserting it — `src/muffin_ingest_dagster`
        # is typed in the `definitions` job, where Dagster is present.
        #
        # `tests/unit` rather than `tests`, for the same reason: `tests/dagster` exercises the assets
        # and necessarily imports an orchestrator. Pointing this job at all of `tests` would fail on
        # that, and the tempting fix — installing dagster here — would quietly delete the guarantee
        # this job exists for.
        run: mypy --strict src/muffin_ingest tests/unit

      - name: Tests
        run: PYTHONPATH=src pytest tests/unit -q

  # SEPARATE, because `muffin_ingest` deliberately imports no Dagster and its suite must not need
  # one. This job is the other half of that rule: it proves the code location actually LOADS, which
  # is the failure the image would otherwise ship — the container's start command names
  # `muffin_ingest_dagster.definitions`, and a module that does not import is a service that
  # restart-loops with the reason only in `docker service logs`.
  definitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install (dagster and what the assets touch; no provider extras)
        run: |
          python -m pip install --upgrade pip
          pip install "dagster>=1.11,<1.13" "psycopg[binary]" pyarrow pydantic httpx \
            prometheus-client mypy pytest
      - name: The code location loads
        # `dagster definitions validate` is the same load the gRPC server performs at startup, so a
        # green here means the service can start.
        run: PYTHONPATH=src dagster definitions validate -m muffin_ingest_dagster.definitions
      - name: Types
        run: PYTHONPATH=src mypy --strict src/muffin_ingest_dagster tests/dagster
      - name: Tests
        # The assets driven end to end against a fake provider and a fake database — which is the
        # only way the things that actually break here are visible: which partition a file lands on,
        # and whether a symbol omitted from a batched answer is recorded as empty rather than dead.
        run: PYTHONPATH=src pytest tests/dagster -q

  image:
    # arm64, because the Oracle node is aarch64 and an amd64-only image cannot schedule there.
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/gururafiki/muffin-ingest:latest
            ghcr.io/gururafiki/muffin-ingest:${{ github.sha }}
      - name: Every entrypoint the stack runs exists in the image
        # THE IMAGE BUILT, THE CODE LOCATION LOADED AND `definitions validate` PASSED while
        # `dagster-webserver` was not installed at all — it is a separate distribution and
        # `dagster` does not depend on it. The webserver service then crash-looped with
        # `exec: "dagster-webserver": executable file not found in $PATH`, which reads as a broken
        # image rather than a missing dependency, and cost a deploy to find.
        #
        # One image runs all three Swarm services, so it must carry all three entrypoints. Run
        # against the PUSHED tag, not a local build: what the node pulls is the thing worth
        # checking.
        run: |
          docker run --rm --entrypoint sh ghcr.io/gururafiki/muffin-ingest:${{ github.sha }} -c '
            set -e
            for bin in dagster dagster-webserver dagster-daemon; do
              command -v "$bin" >/dev/null || { echo "::error::$bin is not in the image PATH"; exit 1; }
              echo "ok  $bin"
            done'

      - name: Every route the library declares resolves on the real hub
        # NO `--user`, DELIBERATELY: this must run as whoever the image runs as, because that is the
        # whole failure. `import openbb` reconciles installed extensions against a static map inside
        # site-packages and REBUILDS when they differ — which needs write access the runtime user
        # does not have, and raises PermissionError on every provider call.
        #
        # It did not look like a packaging problem. The exception surfaced as a failed batch, the
        # isolation pass failed every symbol, and the asset reported fifty securities as having
        # answered nothing. Found by driving the asset against production; no unit test could see it,
        # because the tests drive a fake hub for exactly the reason that makes this possible.
        # AND THE IMPORT SUCCEEDING IS ITSELF HALF THE TEST. As the runtime user a rebuild raises
        # PermissionError, so reaching the loop at all proves the map shipped built.
        #
        # The other half is that a hub can import perfectly and serve nothing. An extension
        # supplying the DATA is not the one supplying the NAMESPACE: with providers alone,
        # `obb.equity` does not exist and every call dies on a bare AttributeError. The built
        # package held eleven modules, all `economy*` and `fixedincome*`, and no test could see it
        # because the unit tests drive a FAKE hub — deliberately, so they need no 250 MB of AGPL
        # code, which is exactly what makes this check the only place the real one is exercised.
        run: |
          docker run --rm ghcr.io/gururafiki/muffin-ingest:${{ github.sha }} \
            python -c '
          import sys
          # The INSTALLED package, not /app/src — what the service actually imports.
          from muffin_ingest.providers.openbb import ROUTES, _load_hub, _resolve
          hub = _load_hub()
          missing = []
          for route in sorted(ROUTES):
              try:
                  _resolve(hub, route)
              except Exception as e:
                  missing.append(f"{route}: {type(e).__name__}: {e}")
          for m in missing:
              print(f"::error::{m}")
          print(f"{len(ROUTES) - len(missing)}/{len(ROUTES)} routes resolve")
          sys.exit(1 if missing else 0)'
