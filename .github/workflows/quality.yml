# Required check. Mirrors muffin-deployment's `quality.yml` in spirit: it does not ask whether the
# code is tidy, it asks whether the rules that keep this pipeline honest still hold.
#
# The workspace has two environments and the split between these jobs IS one of those rules: the
# library must build and pass with no orchestrator installed, and the code location must load with
# no provider hub installed. Each job proves its half by having nothing else available.
name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  # NEVER cancel on main. Two merges seconds apart used to kill the first one's verification run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The resolver is pinned with the lock it reads: a lockfile is a guarantee only if both are.
  UV_VERSION: "0.12.15"
  # Telemetry off for Dagster AND for `dg`, which asks the same question through this file.
  DAGSTER_HOME: ${{ github.workspace }}/deployments/local/dagster_home

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/muffin-ingest-lib
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
      - name: Install (the library and its dev group; uv fetches the interpreter it needs)
        run: uv sync --frozen

      # NO DAGSTER AND NO HUB, AND BOTH ABSENCES ARE THE POINT. The ledger takes a PROTOCOL
      # (`DbConn`) rather than a driver, the library imports no orchestrator, and `providers/openbb`
      # imports the hub inside a function — so this job passing is what proves all three rather
      # than a comment asserting them.
      - name: The library depends on no orchestrator
        run: |
          if uv run python -c "import dagster" 2>/dev/null; then
            echo "::error::dagster is installed in the library environment — the split has broken"
            exit 1
          fi
          echo "  ok  no dagster in this environment"

      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Types
        # Strict. The classifier decides whether thousands of securities get negative-cached, and a
        # `str | None` slipping through is exactly how that goes wrong quietly.
        run: uv run mypy --strict src/muffin_ingest tests
      - name: Tests
        run: uv run pytest -q

  # SEPARATE, because `muffin_ingest` deliberately imports no Dagster and its suite must not need
  # one. This job is the other half of that rule: it proves the code location actually LOADS, which
  # is the failure the image would otherwise ship — the container's start command names
  # `muffin_ingest_dagster.definitions`, and a module that does not import is a service that
  # restart-loops with the reason only in `docker service logs`.
  definitions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/muffin-ingest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
      - name: Install (the code location WITHOUT the `hub` extra)
        run: uv sync --frozen
      - name: The code location loads with no provider hub installed
        run: |
          if uv run python -c "import openbb" 2>/dev/null; then
            echo "::error::openbb is installed here — this job can no longer prove the lazy import"
            exit 1
          fi
          echo "  ok  no openbb in this environment"
      - name: The code location loads
        # The same load the gRPC server performs at startup, so a green here means it can start.
        run: uv run dagster definitions validate -m muffin_ingest_dagster.definitions
      - name: Every definition resolves through dg
        run: uv run dg check defs
      - name: Types
        run: uv run mypy --strict src/muffin_ingest_dagster tests
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Tests
        # The assets driven end to end against a fake provider and a fake database — which is the
        # only way the things that actually break here are visible: which partition a file lands on,
        # and whether a symbol omitted from a batched answer is recorded as empty rather than dead.
        # `test_definitions_snapshot` is the one that fails on a rename: names are state.
        run: uv run pytest -q

  image:
    # arm64, because the Oracle node is aarch64 and an amd64-only image cannot schedule there.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    # IT BUILDS ON A PR AND PUSHES ONLY FROM `main`. Until 2026-09-19 this job was `main`-only, so
    # the Dockerfile was first exercised AFTER the merge that could break it — the same shape as a
    # native build that no pull-request check ever ran. Building without pushing costs one arm
    # runner and makes the three checks below a gate rather than a post-mortem.
    env:
      # The same reference either way: on a PR it names the image loaded into the runner's daemon,
      # on `main` the one just pushed — so the checks below are one set of commands, not two.
      IMAGE: ghcr.io/gururafiki/muffin-ingest:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: The uv pin in the Dockerfile is the one this workflow resolves with
        # THE SAME FACT IN TWO PLACES WILL DRIFT, AND DEPENDABOT CAN ONLY SEE ONE OF THEM. It
        # watches the Dockerfile, so it would propose `ghcr.io/astral-sh/uv:<new>` while
        # `UV_VERSION` above keeps resolving these lockfiles with the old binary — a green PR that
        # leaves CI and the image on different resolvers. A lock is a guarantee only if both halves
        # read it the same way, which is why that env var says so and this asserts it.
        run: |
          pinned=$(sed -n 's|.*ghcr.io/astral-sh/uv:\([0-9][^ ]*\).*|\1|p' projects/muffin-ingest/Dockerfile)
          test -n "$pinned" || { echo "::error::no uv pin found in the Dockerfile"; exit 1; }
          [ "$pinned" = "$UV_VERSION" ] || {
            echo "::error::Dockerfile pins uv $pinned, quality.yml resolves with $UV_VERSION"
            exit 1
          }
          echo "uv $pinned in both"
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # THE WORKSPACE ROOT IS THE CONTEXT: the code location installs the library from
          # `libs/muffin-ingest-lib` as a path source, so both trees must be in it.
          context: .
          file: projects/muffin-ingest/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          # On a PR the image stays in the runner's daemon, which is what the checks below need.
          load: ${{ github.ref != 'refs/heads/main' }}
          platforms: linux/arm64
          tags: |
            ghcr.io/gururafiki/muffin-ingest:latest
            ghcr.io/gururafiki/muffin-ingest:${{ github.sha }}
      - name: Every entrypoint the stack runs exists in the image
        # THE IMAGE BUILT, THE CODE LOCATION LOADED AND `definitions validate` PASSED while
        # `dagster-webserver` was not installed at all — it is a separate distribution and
        # `dagster` does not depend on it. The webserver service then crash-looped with
        # `exec: "dagster-webserver": executable file not found in $PATH`, which reads as a broken
        # image rather than a missing dependency, and cost a deploy to find.
        #
        # One image runs all three Swarm services, so it must carry all three entrypoints. It runs
        # against the image this job just built — the same bytes the node will pull once `main`
        # pushes them — never a separate local build of its own.
        run: |
          docker run --rm --entrypoint sh $IMAGE -c '
            set -e
            for bin in dagster dagster-webserver dagster-daemon; do
              command -v "$bin" >/dev/null || { echo "::error::$bin is not in the image PATH"; exit 1; }
              echo "ok  $bin"
            done'

      - name: The code location loads INSIDE the image, as the runtime user
        # The two environment jobs above prove the code loads where the tooling is; this proves it
        # loads where it will run — as uid 10001, against a root-owned venv, with the hub present
        # and its extension map already built. `load_from_defs_folder` finds the project by walking
        # up to `pyproject.toml`, so this also catches an install layout that leaves it behind.
        run: |
          docker run --rm $IMAGE sh -c '
            set -e
            test "$(id -u)" = 10001 || { echo "::error::image does not run as uid 10001"; exit 1; }
            dagster definitions validate -m muffin_ingest_dagster.definitions'

      - name: Every namespace we call exists on the real hub
        # WHAT THIS CHECKS, AND WHAT IT CANNOT — both measured, after two attempts that claimed more.
        #
        # ATTEMPT 1 was `mypy --strict` against the hub, on the grounds that openbb ships `py.typed`
        # so a wrong keyword would become a check-time error. mypy 2.3.1 CRASHES on openbb's
        # generated package (`INTERNAL ERROR`, no file, no line, no traceback).
        #
        # ATTEMPT 2 was binding our keywords against `inspect.signature` of the real callable. It
        # does not work either, and the reason kills the premise of both:
        #
        #     >>> inspect.signature(obb.equity.price.historical)
        #     (symbol, start_date, end_date, provider, **kwargs)
        #
        # THE ROUTE TAKES `**kwargs`. `start=` binds perfectly and is swallowed, so a misspelled
        # keyword is not a TypeError, is not a mypy error, and is not a bind failure — it silently
        # uses the default and returns a plausible wrong answer. No static check can see it.
        #
        # So this checks the thing that IS statically knowable and that actually bit us: whether the
        # NAMESPACE exists. Installing `openbb-yfinance` without `openbb-equity` leaves a hub that
        # imports perfectly and cannot serve a single route, failing with `'App' object has no
        # attribute 'equity'` on the first call in production.
        #
        # A wrong keyword is caught BEHAVIOURALLY instead, by the window filter: ask for one day,
        # get the provider's default range back, and `outside_window` moves. That is a real signal
        # and it is the one available.
        #
        # Reaching the check at all is the other half: as the runtime user a rebuild of the
        # extension map raises PermissionError, so a clean import proves the map shipped built.
        run: |
          docker run --rm $IMAGE python -c '
          import sys
          from openbb import obb

          # The namespaces `providers/openbb.py` reaches for, written out so adding a call here is
          # the same edit as adding one there.
          NAMESPACES = ["equity.price.historical"]

          missing = []
          for path in NAMESPACES:
              node = obb
              for part in path.split("."):
                  node = getattr(node, part, None)
                  if node is None:
                      missing.append(f"{path}: the hub has no `{part}` — the ROUTER extension for "
                                     f"it is probably not installed (providers supply data, not "
                                     f"namespaces)")
                      break
              else:
                  if not callable(node):
                      missing.append(f"{path}: resolved to {type(node).__name__}, not a callable")

          for m in missing:
              print(f"::error::{m}")
          print(f"{len(NAMESPACES) - len(missing)}/{len(NAMESPACES)} namespaces resolve")
          sys.exit(1 if missing else 0)'
