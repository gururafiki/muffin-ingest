# Required check. Mirrors muffin-deployment's `quality.yml` in spirit: it does not ask whether the
# code is tidy, it asks whether the rules that keep this pipeline honest still hold.
name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  # NEVER cancel on main. Two merges seconds apart used to kill the first one's verification run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The dev extra only — the runtime pulls openbb and dagster, which are minutes of resolution
      # and irrelevant to the pure-logic suite. The image build is where the full set is proven.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # NO psycopg AND NO DAGSTER, and both absences are the point. The ledger takes a
          # PROTOCOL (`DbConn`) rather than a driver, and the library imports no orchestrator, so
          # this job passing is what proves both rather than a comment asserting them.
          pip install ruff mypy pytest pytest-cov pydantic

      - name: Lint
        run: ruff check src tests && ruff format --check src tests

      - name: Types
        # Strict. The classifier decides whether thousands of securities get negative-cached, and a
        # `str | None` slipping through is exactly how that goes wrong quietly.
        #
        # THE LIBRARY ONLY. `muffin_ingest` imports no Dagster by design, and checking it without
        # one installed is what proves that rather than asserting it — `src/muffin_ingest_dagster`
        # is typed in the `definitions` job, where Dagster is present.
        run: mypy --strict src/muffin_ingest tests

      - name: Tests
        run: PYTHONPATH=src pytest -q

  # SEPARATE, because `muffin_ingest` deliberately imports no Dagster and its suite must not need
  # one. This job is the other half of that rule: it proves the code location actually LOADS, which
  # is the failure the image would otherwise ship — the container's start command names
  # `muffin_ingest_dagster.definitions`, and a module that does not import is a service that
  # restart-loops with the reason only in `docker service logs`.
  definitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install (dagster only; no provider extras needed to load definitions)
        run: |
          python -m pip install --upgrade pip
          pip install "dagster>=1.11,<1.13" "psycopg[binary]" mypy
      - name: The code location loads
        # `dagster definitions validate` is the same load the gRPC server performs at startup, so a
        # green here means the service can start.
        run: PYTHONPATH=src dagster definitions validate -m muffin_ingest_dagster.definitions
      - name: Types
        run: PYTHONPATH=src mypy --strict src/muffin_ingest_dagster

  image:
    # arm64, because the Oracle node is aarch64 and an amd64-only image cannot schedule there.
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/gururafiki/muffin-ingest:latest
            ghcr.io/gururafiki/muffin-ingest:${{ github.sha }}
